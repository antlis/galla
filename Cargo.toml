[package]
name = "galla"
version = "0.2.1"
edition = "2021"
description = "Minimal, keyboard-driven image & video thumbnail gallery with a built-in zoom/pan viewer and a configurable external video player"
license = "MIT"
repository = "https://github.com/antlis/galla"
homepage = "https://github.com/antlis/galla"
readme = "README.md"
keywords = ["gallery", "image-viewer", "thumbnails", "viewer", "mpv"]
categories = ["command-line-utilities", "multimedia::images"]
exclude = ["/.github", "/demo.gif"]

[dependencies]
eframe = "0.29"
image = "0.25"
arboard = "3"
trash = "5"

[profile.release]
opt-level = 3
