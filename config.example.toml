# Copy to ~/.config/galla/config.toml
# External command used to play videos; the video path is appended.
player = "mpv"

# External drag-and-drop source spawned by the `d` key; the file paths are
# appended. dragon-drop shows a small window you can drag into other apps;
# --all makes a multi-file drag move every file in a single drag.
drag = "dragon-drop --and-exit --all"
